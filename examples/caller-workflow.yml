name: ClaudeCode Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/claude-code-review.yml'

  claude-code-review:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.workflow != 'true' }}
    uses: amir-bialek/claude-code-reviewer-cost/.github/workflows/claude-code-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets: inherit
